<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LankaCommerce Cloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="splash">
    <div class="logo-wrap">🛒</div>
    <div>
      <h1>LankaCommerce Cloud</h1>
      <p>Multi-Tenant SaaS ERP for Sri Lankan SMEs</p>
    </div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="statusText">Checking session…</div>

    <!-- Fallback manual navigation (shown after 2s) -->
    <div class="app-cards" id="appCards">
      <a href="auth/login.html" class="app-card">
        <i class="fa-solid fa-right-to-bracket"></i>
        <div class="app-name">Sign In</div>
        <div class="app-desc">Access your account</div>
      </a>
      <a href="erp/dashboard.html" class="app-card">
        <i class="fa-solid fa-chart-pie"></i>
        <div class="app-name">ERP Dashboard</div>
        <div class="app-desc">Manage your business</div>
      </a>
      <a href="pos/index.html" class="app-card">
        <i class="fa-solid fa-cash-register"></i>
        <div class="app-name">POS Terminal</div>
        <div class="app-desc">Point of sale</div>
      </a>
      <a href="webstore/index.html" class="app-card">
        <i class="fa-solid fa-store"></i>
        <div class="app-name">Webstore</div>
        <div class="app-desc">Customer storefront</div>
      </a>
      <a href="admin/index.html" class="app-card">
        <i class="fa-solid fa-shield-halved"></i>
        <div class="app-name">Admin Panel</div>
        <div class="app-desc">Platform management</div>
      </a>
      <a href="auth/login.html?demo=admin" class="app-card">
        <i class="fa-solid fa-play"></i>
        <div class="app-name">Quick Demo</div>
        <div class="app-desc">Auto-fill demo login</div>
      </a>
    </div>
  </div>

  
  <script src="index.js"></script>
</body>
</html>
