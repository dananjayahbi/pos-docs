<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Orders — LankaCommerce Cloud</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/layout.css" />
  <link rel="stylesheet" href="../erp.css"/>
  <link rel="stylesheet" href="orders.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-wrapper" id="mainWrapper">
    <header class="top-bar" id="erpTopBar" data-page-title="Sales Orders"></header>

<div class="page-content">

    <!-- Page Header -->
    <div class="page-header">
      <div>
        <h1 class="page-title">Sales Orders</h1>
        <p class="page-subtitle" id="ordersSubtitle">Loading orders…</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline btn-sm" id="exportBtn" onclick="exportOrders()">
          <i class="fa-solid fa-file-export"></i>
          Export
        </button>
        <button class="btn btn-primary btn-sm" onclick="openNewOrderModal()">
          <i class="fa-solid fa-plus"></i>
          New Order
        </button>
      </div>
    </div>

    <!-- KPI Cards Grid -->
    <div class="kpi-grid" id="kpiGrid">
      <div class="kpi-card skeleton-card"><div class="skeleton" style="height:44px;width:44px;border-radius:12px;"></div><div class="skeleton" style="height:28px;width:110px;margin-top:0.75rem;"></div><div class="skeleton" style="height:16px;width:80px;margin-top:0.4rem;"></div></div>
      <div class="kpi-card skeleton-card"><div class="skeleton" style="height:44px;width:44px;border-radius:12px;"></div><div class="skeleton" style="height:28px;width:110px;margin-top:0.75rem;"></div><div class="skeleton" style="height:16px;width:80px;margin-top:0.4rem;"></div></div>
      <div class="kpi-card skeleton-card"><div class="skeleton" style="height:44px;width:44px;border-radius:12px;"></div><div class="skeleton" style="height:28px;width:110px;margin-top:0.75rem;"></div><div class="skeleton" style="height:16px;width:80px;margin-top:0.4rem;"></div></div>
      <div class="kpi-card skeleton-card"><div class="skeleton" style="height:44px;width:44px;border-radius:12px;"></div><div class="skeleton" style="height:28px;width:110px;margin-top:0.75rem;"></div><div class="skeleton" style="height:16px;width:80px;margin-top:0.4rem;"></div></div>
    </div>

    <!-- Orders Panel Card: Tabs + Toolbar + Table -->
    <div class="orders-panel-card">

      <!-- Tabs -->
      <div class="order-tabs" id="orderTabs">
        <div class="order-tab active" data-tab="all">All <span class="tab-count" id="tabCount-all">0</span></div>
        <div class="order-tab" data-tab="pending">Pending <span class="tab-count" id="tabCount-pending">0</span></div>
        <div class="order-tab" data-tab="confirmed">Confirmed <span class="tab-count" id="tabCount-confirmed">0</span></div>
        <div class="order-tab" data-tab="processing">Processing <span class="tab-count" id="tabCount-processing">0</span></div>
        <div class="order-tab" data-tab="shipped">Shipped <span class="tab-count" id="tabCount-shipped">0</span></div>
        <div class="order-tab" data-tab="delivered">Delivered <span class="tab-count" id="tabCount-delivered">0</span></div>
        <div class="order-tab" data-tab="cancelled">Cancelled <span class="tab-count" id="tabCount-cancelled">0</span></div>
        <div class="order-tab" data-tab="returned">Returned <span class="tab-count" id="tabCount-returned">0</span></div>
      </div>

      <!-- Toolbar -->
      <div class="orders-toolbar">
        <div class="toolbar-search">
          <i class="fa-solid fa-search toolbar-search-icon"></i>
          <input type="text" id="searchInput" placeholder="Search order # or customer name…" oninput="handleSearch()" />
        </div>
        <select class="toolbar-select" id="sourceFilter" onchange="applyFilters()">
          <option value="">All Sources</option>
          <option value="pos">POS</option>
          <option value="webstore">Webstore</option>
          <option value="manual">Manual</option>
          <option value="whatsapp">WhatsApp</option>
        </select>
        <input type="date" class="toolbar-date" id="dateFrom" title="From date" onchange="applyFilters()" />
        <input type="date" class="toolbar-date" id="dateTo" title="To date" onchange="applyFilters()" />
        <select class="toolbar-select" id="paymentFilter" onchange="applyFilters()">
          <option value="">All Payments</option>
          <option value="paid">Paid</option>
          <option value="partially_paid">Partially Paid</option>
          <option value="pending">Unpaid/Pending</option>
        </select>
        <button class="btn btn-xs btn-outline" onclick="clearFilters()" title="Clear filters">
          <i class="fa-solid fa-xmark"></i> Clear
        </button>
      </div>

      <!-- Bulk Actions Bar -->
      <div class="bulk-actions-bar" id="bulkActionsBar">
      <span class="bulk-selected-count" id="bulkCount">0</span>
      <span style="color:var(--color-neutral-600);">orders selected</span>
      <div style="display:flex;gap:0.5rem;margin-left:auto;">
        <select class="toolbar-select" id="bulkStatusSelect" style="font-size:0.75rem;padding:0.35rem 0.625rem;">
          <option value="">Change Status…</option>
          <option value="confirmed">Set Confirmed</option>
          <option value="processing">Set Processing</option>
          <option value="shipped">Set Shipped</option>
          <option value="delivered">Set Delivered</option>
          <option value="cancelled">Set Cancelled</option>
        </select>
        <button class="btn btn-xs btn-outline" onclick="applyBulkStatus()">Apply</button>
        <button class="btn btn-xs btn-outline" onclick="exportSelected()">
          <i class="fa-solid fa-file-export"></i> Export Selected
        </button>
        <button class="btn btn-xs btn-outline" onclick="clearSelection()" title="Deselect all">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- Orders Table -->
    <div class="orders-table-wrap">
      <table class="orders-table" id="ordersTable">
        <thead>
          <tr>
            <th style="width:40px;"><input type="checkbox" class="select-all-checkbox" id="selectAll" onchange="toggleSelectAll(this)" /></th>
            <th class="sortable" onclick="sortBy('id')">Order # <i class="fa-solid fa-sort" style="font-size:0.65rem;color:var(--color-neutral-400);"></i></th>
            <th>Customer</th>
            <th>Source</th>
            <th class="sortable" onclick="sortBy('date')">Date <i class="fa-solid fa-sort" style="font-size:0.65rem;color:var(--color-neutral-400);"></i></th>
            <th style="text-align:center;">Items</th>
            <th class="sortable" onclick="sortBy('total')">Total <i class="fa-solid fa-sort" style="font-size:0.65rem;color:var(--color-neutral-400);"></i></th>
            <th>Payment</th>
            <th>Status</th>
            <th style="text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody">
          <tr>
            <td colspan="10" style="text-align:center;padding:3rem;">
              <i class="fa-solid fa-spinner fa-spin" style="font-size:1.5rem;color:var(--color-neutral-300);"></i>
            </td>
          </tr>
        </tbody>
      </table>
      <!-- Pagination -->
      <div class="pagination-row">
        <div id="paginationInfo">Showing 0 of 0 orders</div>
        <div class="pagination-btns" id="paginationBtns"></div>
      </div>
    </div>

    </div><!-- /.orders-panel-card -->

  </div><!-- /.page-content -->

<!-- ──────────────── ORDER DETAIL SLIDE-OVER ──────────────── -->
<div class="slideover-overlay" id="detailOverlay" onclick="closeDetail()"></div>
<div class="slideover-panel" id="detailPanel">
  <div class="slideover-header">
    <div>
      <div class="slideover-title" id="detailOrderNum">Order #</div>
      <div class="slideover-subtitle" id="detailOrderMeta">Loading…</div>
    </div>
    <div style="display:flex;align-items:center;gap:0.5rem;">
      <span id="detailStatusBadge"></span>
      <select class="status-update-select" id="detailStatusSelect" onchange="updateOrderStatus()">
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="processing">Processing</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
        <option value="returned">Returned</option>
      </select>
      <button class="action-btn primary" onclick="editCurrentOrder()"><i class="fa-solid fa-pen"></i> Edit</button>
      <button class="action-btn" onclick="printOrder()"><i class="fa-solid fa-print"></i> Print</button>
      <button class="slideover-close" onclick="closeDetail()"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>
  <div class="slideover-body" id="detailBody">
    <!-- Populated dynamically -->
  </div>
</div>

  </div><!-- /.main-wrapper -->
</div><!-- /.app-shell -->

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script src="../../assets/js/utils.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../erp-header.js"></script>
<script src="../erp.js"></script>
<script src="../../assets/js/toast.js"></script>
<script src="../new-order-modal.js"></script>

  <script src="orders.js"></script>
</body>
</html>
