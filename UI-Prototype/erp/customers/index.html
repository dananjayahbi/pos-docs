<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers — LankaCommerce Cloud</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/layout.css" />
  <link rel="stylesheet" href="../erp.css"/>
  <link rel="stylesheet" href="customers.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-wrapper" id="mainWrapper">
    <header class="top-bar" id="erpTopBar" data-page-title="Customers"></header>

<div class="page-content">

    <!-- Page Header -->
    <div class="page-header">
      <div>
        <h1 class="page-title">Customers</h1>
        <p class="page-subtitle" id="custSubtitle">Loading customer data…</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline btn-sm" id="btnImport" title="Import customers from CSV">
          <i class="fa-solid fa-file-import"></i> Import
        </button>
        <button class="btn btn-outline btn-sm" id="btnExport" title="Export customers to CSV">
          <i class="fa-solid fa-file-export"></i> Export
        </button>
        <button class="btn btn-primary btn-sm" id="btnAddCustomer">
          <i class="fa-solid fa-user-plus"></i> Add Customer
        </button>
      </div>
    </div>

    <!-- Stat pills -->
    <div class="stat-pills" id="statPills">
      <div class="stat-pill"><span class="pill-dot orange"></span> Total <strong id="statTotal">–</strong></div>
      <div class="stat-pill"><span class="pill-dot green"></span> Active <strong id="statActive">–</strong></div>
      <div class="stat-pill"><span class="pill-dot purple"></span> VIP / Platinum <strong id="statVip">–</strong></div>
      <div class="stat-pill"><span class="pill-dot red"></span> Has Balance <strong id="statOverdue">–</strong></div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-search">
        <i class="fa-solid fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search by name, phone, or email…" autocomplete="off" />
      </div>
      <select id="filterTier" title="Filter by tier">
        <option value="">All Tiers</option>
        <option value="Bronze">Bronze</option>
        <option value="Silver">Silver</option>
        <option value="Gold">Gold</option>
        <option value="Platinum">Platinum</option>
      </select>
      <select id="filterType" title="Filter by type">
        <option value="">All Types</option>
        <option value="individual">Individual</option>
        <option value="business">Business</option>
      </select>
      <select id="filterProvince" title="Filter by province">
        <option value="">All Provinces</option>
        <option>Western Province</option>
        <option>Central Province</option>
        <option>Southern Province</option>
        <option>Northern Province</option>
        <option>Eastern Province</option>
        <option>North Western Province</option>
        <option>North Central Province</option>
        <option>Uva Province</option>
        <option>Sabaragamuwa Province</option>
      </select>
      <div class="toolbar-actions">
        <button class="btn btn-sm btn-outline" id="btnBulkDelete" style="display:none;" title="Delete selected">
          <i class="fa-solid fa-trash"></i> Delete (<span id="bulkCount">0</span>)
        </button>
        <button class="btn btn-sm btn-outline" onclick="clearFilters()">
          <i class="fa-solid fa-xmark"></i> Clear
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="data-table-wrap">
      <table class="data-table" id="custTable">
        <thead>
          <tr>
            <th class="cb-col"><input type="checkbox" id="selectAll" title="Select all" /></th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Tier</th>
            <th>Orders</th>
            <th>Total Spent</th>
            <th>Outstanding</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="custTableBody">
          <tr><td colspan="9" class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><p>Loading customers…</p></td></tr>
        </tbody>
      </table>

      <!-- Pagination -->
      <div class="pagination" id="pagination">
        <span id="paginationInfo">Showing 0 of 0</span>
        <div class="pagination-btns" id="paginationBtns"></div>
      </div>
    </div>

  </div>
</main>

<!-- ══════════════ ADD / EDIT CUSTOMER MODAL ══════════════ -->
<div class="modal-overlay" id="customerModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Add Customer</span>
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="customerForm">
      <div class="modal-body">

        <!-- Personal Info -->
        <div class="form-section-title"><i class="fa-solid fa-user" style="margin-right:0.4rem;"></i>Personal Information</div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">First Name <span class="req">*</span></label>
            <input type="text" class="form-control" id="fFirstName" placeholder="Kamal" required />
          </div>
          <div class="form-group">
            <label class="form-label">Last Name <span class="req">*</span></label>
            <input type="text" class="form-control" id="fLastName" placeholder="Perera" required />
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="fEmail" placeholder="kamal@example.com" />
          </div>
          <div class="form-group">
            <label class="form-label">Phone <span class="req">*</span></label>
            <div class="phone-input">
              <span class="phone-prefix">+94</span>
              <input type="tel" class="form-control" id="fPhone" placeholder="77 123 4567" maxlength="12" required />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Date of Birth</label>
            <input type="date" class="form-control" id="fDob" />
          </div>
          <div class="form-group">
            <label class="form-label">Customer Type</label>
            <select class="form-control" id="fCustType">
              <option value="individual">Individual</option>
              <option value="business">Business</option>
            </select>
          </div>
        </div>

        <!-- Address -->
        <div class="form-section-title"><i class="fa-solid fa-location-dot" style="margin-right:0.4rem;"></i>Address</div>
        <div class="form-grid">
          <div class="form-group span2">
            <label class="form-label">Address Line 1</label>
            <input type="text" class="form-control" id="fAddr1" placeholder="123, Galle Road" />
          </div>
          <div class="form-group">
            <label class="form-label">Province</label>
            <select class="form-control" id="fProvince" onchange="cascadeDistrict()">
              <option value="">Select Province</option>
              <option>Western Province</option>
              <option>Central Province</option>
              <option>Southern Province</option>
              <option>Northern Province</option>
              <option>Eastern Province</option>
              <option>North Western Province</option>
              <option>North Central Province</option>
              <option>Uva Province</option>
              <option>Sabaragamuwa Province</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">District</label>
            <select class="form-control" id="fDistrict">
              <option value="">Select Province first</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">City</label>
            <input type="text" class="form-control" id="fCity" placeholder="Colombo 03" />
          </div>
        </div>

        <!-- Business Info -->
        <div class="form-section-title"><i class="fa-solid fa-building" style="margin-right:0.4rem;"></i>Business Information</div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Company Name</label>
            <input type="text" class="form-control" id="fCompany" placeholder="Perera &amp; Co." />
          </div>
          <div class="form-group">
            <label class="form-label">Tax Number (NIC / VAT)</label>
            <input type="text" class="form-control" id="fTaxId" placeholder="VAT-12345678" />
          </div>
          <div class="form-group">
            <label class="form-label">Customer Group / Tier</label>
            <select class="form-control" id="fTier">
              <option value="Bronze">Bronze (New)</option>
              <option value="Silver">Silver</option>
              <option value="Gold">Gold</option>
              <option value="Platinum">Platinum (VIP)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Credit Limit (LKR)</label>
            <input type="number" class="form-control" id="fCreditLimit" placeholder="50000" min="0" />
          </div>
          <div class="form-group">
            <label class="form-label">Payment Terms</label>
            <select class="form-control" id="fPayTerms">
              <option value="Immediate">Immediate</option>
              <option value="Net30">Net 30</option>
              <option value="Net60">Net 60</option>
            </select>
          </div>
        </div>

        <!-- Notes -->
        <div class="form-section-title"><i class="fa-solid fa-note-sticky" style="margin-right:0.4rem;"></i>Notes</div>
        <div class="form-grid full">
          <div class="form-group">
            <label class="form-label">Internal Notes</label>
            <textarea class="form-control" id="fNotes" placeholder="Add any notes about this customer…" style="min-height:80px;"></textarea>
          </div>
        </div>

      </div><!-- modal-body -->
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="modalSaveBtn">
          <i class="fa-solid fa-floppy-disk"></i> Save Customer
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ══════════════ CUSTOMER DETAIL SLIDE-OVER ══════════════ -->
<div class="slideover-overlay" id="slideoverOverlay" onclick="closeSlideOver()"></div>
<div class="slideover" id="slideover">
  <div class="slideover-header">
    <span style="font-weight:700;font-size:0.9375rem;">Customer Detail</span>
    <button class="slideover-close" onclick="closeSlideOver()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="slideover-body" id="slideoverBody">
    <!-- Populated dynamically -->
  </div>

  </div><!-- /.main-wrapper -->
</div><!-- /.app-shell -->

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<!-- ══════════════ SCRIPTS ══════════════ -->
<script src="../../assets/js/utils.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../erp-header.js"></script>
<script src="../erp.js"></script>
<script src="../../assets/js/toast.js"></script>

  <script src="customers.js"></script>
</body>
</html>
